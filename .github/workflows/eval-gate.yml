name: Agent Eval Gate

on:
  pull_request:
    paths:
      - "eval/**"
      - "ci_gate.py"

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python ci_gate.py
